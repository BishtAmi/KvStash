[workspace]
members = [
    "crates/kv-types",
    "crates/kv-core",
    "crates/kv-proto",
    "crates/kv-transport",
    "crates/kv-server",
    "crates/kv-client",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
bytes = "1"
blake3 = "1.5"
lru = "0.12"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
proptest = "1"
